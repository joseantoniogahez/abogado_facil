name: abogado-facil-dev

services:
  object-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:-minioadmin}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - object_storage_data:/data

  object-storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      object-storage:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-minioadmin}"
      S3_BUCKET: "${S3_BUCKET:-documents}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-minioadmin}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://object-storage:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}" &&
        mc anonymous set none "local/$${S3_BUCKET}"
    restart: "no"

  database:
    image: postgres:18.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 20s
      timeout: 20s
      retries: 20
      start_period: 10s
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"

  backend:
    build:
      context: backend
      args:
        PYTHON_VERSION: "${PYTHON_VERSION:-3.14}"
    depends_on:
      database:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${API_PORT:-8000}/v1/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    environment:
      APP_ENV: "${APP_ENV:-local}"
      API_CORS_ORIGINS: "${API_CORS_ORIGINS}"
      API_PATH: "${API_PATH}"
      DB_HOST: "${DB_HOST}"
      DB_NAME: "${DB_NAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_PORT: "${DB_PORT}"
      DB_TYPE: "${DB_TYPE}"
      DB_USER: "${DB_USER}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}"
      JWT_ISSUER: "${JWT_ISSUER:-abogado-facil}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-abogado-facil-api}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-local-dev-jwt-secret-change-me-now}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-minioadmin}"
      S3_BUCKET: "${S3_BUCKET:-documents}"
      S3_CONNECT_TIMEOUT_SECONDS: "${S3_CONNECT_TIMEOUT_SECONDS:-3}"
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-http://object-storage:9000}"
      S3_PATH_STYLE: "${S3_PATH_STYLE:-true}"
      S3_READ_TIMEOUT_SECONDS: "${S3_READ_TIMEOUT_SECONDS:-10}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-minioadmin}"
      PORT: "${API_PORT}"
    logging:
      driver: "json-file"
      options:
        max-size: "${BACKEND_LOG_MAX_SIZE:-10m}"
        max-file: "${BACKEND_LOG_MAX_FILE:-3}"

  frontend:
    build:
      context: frontend
      args:
        VITE_API_ORIGIN: "${VITE_API_ORIGIN:-http://localhost:8000}"
        VITE_API_BASE_PATH: "${VITE_API_BASE_PATH:-/v1}"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_ORIGIN: "${VITE_API_ORIGIN:-http://localhost:8000}"
      VITE_API_BASE_PATH: "${VITE_API_BASE_PATH:-/v1}"
      PORT: "${UI_PORT}"

volumes:
  object_storage_data:
