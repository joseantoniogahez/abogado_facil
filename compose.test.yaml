name: abogado-facil-tests

services:
  object-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: test-access-key
      MINIO_ROOT_PASSWORD: test-secret-key # pragma: allowlist secret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - object_storage_test_data:/data

  object-storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      object-storage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://object-storage:9000 test-access-key test-secret-key && mc mb --ignore-existing local/documents && mc anonymous set none local/documents"]

  backend-test:
    image: python:${PYTHON_VERSION:-3.14.3}-slim
    working_dir: /workspace/backend
    environment:
      APP_ENV: test
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      S3_ACCESS_KEY: test-access-key
      S3_BUCKET: documents
      S3_ENDPOINT_URL: http://object-storage:9000
      S3_REGION: us-east-1
      S3_SECRET_KEY: test-secret-key # pragma: allowlist secret
    depends_on:
      object-storage-init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/workspace/backend
    command:
      [
        "sh",
        "-c",
        "python -m pip install --upgrade pip && python -m pip install --no-cache-dir -r requirements.txt -r tests/requirements.txt && pytest tests",
      ]

  frontend-test:
    image: node:22-alpine
    working_dir: /workspace/frontend
    environment:
      CI: "true"
      VITE_API_ORIGIN: "${VITE_API_ORIGIN:-http://localhost:8000}"
      VITE_API_BASE_PATH: "${VITE_API_BASE_PATH:-/v1}"
    volumes:
      - ./frontend:/workspace/frontend
      - frontend_test_node_modules:/workspace/frontend/node_modules
    command: ["sh", "-c", "npm install -g npm@11.10.0 && npm ci && npm test"]

volumes:
  object_storage_test_data:
  frontend_test_node_modules:
