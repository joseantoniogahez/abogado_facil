name: abogado-facil-prod

services:
  object-storage:
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY:?S3_ACCESS_KEY is required in prod}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:?S3_SECRET_KEY is required in prod}"
    restart: unless-stopped

  object-storage-init:
    environment:
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:?S3_ACCESS_KEY is required in prod}"
      S3_BUCKET: "${S3_BUCKET:?S3_BUCKET is required in prod}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:?S3_SECRET_KEY is required in prod}"

  database:
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    environment:
      APP_ENV: "prod"
      DB_HOST: database
      JWT_ALGORITHM: "${JWT_ALGORITHM:?JWT_ALGORITHM is required in prod}"
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:?JWT_ACCESS_TOKEN_EXPIRE_MINUTES is required in prod}"
      JWT_ISSUER: "${JWT_ISSUER:?JWT_ISSUER is required in prod}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:?JWT_AUDIENCE is required in prod}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required in prod}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:?S3_ACCESS_KEY is required in prod}"
      S3_BUCKET: "${S3_BUCKET:?S3_BUCKET is required in prod}"
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:?S3_ENDPOINT_URL is required in prod}"
      S3_REGION: "${S3_REGION:?S3_REGION is required in prod}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:?S3_SECRET_KEY is required in prod}"
    restart: unless-stopped
    ports:
      - "${API_PORT}:${API_PORT}"

  frontend:
    build:
      target: production
    restart: unless-stopped
    ports:
      - "${UI_PORT}:${UI_PORT}"

volumes:
  object_storage_data:
  postgres_data:
